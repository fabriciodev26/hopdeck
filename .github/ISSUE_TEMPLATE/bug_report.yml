name: Error / Bug
description: Algo no funciona como debería · Something is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar · Thanks for reporting.
        **¿Es un problema de seguridad?** No lo publiques aquí: lee `SECURITY.md` y avisa en privado. · **Security issue?** Do not post it here: see `SECURITY.md`.
        Antes de empezar, prueba `hopdeck doctor`: dice cómo arreglar los problemas más comunes. · Try `hopdeck doctor` first.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó · What happened
      description: Describe el problema. Si puedes, pega una captura (sin datos privados). · Describe the problem; add a screenshot if you can (no private data).
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara · What you expected
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo · Steps to reproduce
      placeholder: |
        1. Abro el hub con `claude`
        2. Pulso `o` …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión · Version
      description: Salida de `hopdeck --version`
      placeholder: "1.2.0"
    validations:
      required: true
  - type: dropdown
    id: so
    attributes:
      label: Sistema operativo · Operating system
      options: [Windows 11, Windows 10, macOS, Linux, WSL (Windows + Linux), Otro / Other]
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options: [Windows Terminal, PowerShell (otra terminal), CMD, Terminal de macOS, iTerm2, GNOME Terminal / Konsole, Terminal de VS Code, tmux, Otra / Other]
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Modo del hub · Hub mode
      description: Terminal embebido (Windows o sin tmux), tmux, o pantalla completa. Mira el README, sección "Modos".
      options: [Terminal embebido / Embedded terminal, tmux, Pantalla completa / Full screen, No lo sé / I don't know]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Salida de `hopdeck doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Algo más · Anything else
  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Confirmaciones · Checks
      options:
        - label: Busqué si ya existe un issue parecido · I searched for a similar issue
          required: true
        - label: No incluí información privada (el historial de Claude puede contener datos sensibles) · I did not include private information
          required: true
