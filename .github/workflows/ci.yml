name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # cada lunes: detecta vulnerabilidades nuevas en las dependencias aunque no haya cambios

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24] # Node 22 es el mínimo: en Windows, Node 18 y 20 no entregan los eventos de ratón
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test

  audit:
    name: audit y paquete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Vulnerabilidades conocidas en las dependencias
        run: npm audit --audit-level=moderate
      - name: El paquete incluye lo necesario
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const f=require('./pack.json')[0].files.map((x)=>x.path); for (const p of ['bin/hopdeck.js','lib/i18n.js','lib/style.js','LICENSE','README.md']) if (!f.includes(p)) { console.error('Falta en el paquete: '+p); process.exit(1); } console.log(f.length+' archivos en el paquete')"
